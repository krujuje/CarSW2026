<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CarSW2026</title>
    
    <!-- Meta tags สำหรับป้องกัน Caching เพื่อให้โหลดแอปเวอร์ชันล่าสุดเสมอ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        /* ลบ Margin / Padding และซ่อน Scrollbar ของตัวหน้าเว็บหลัก */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh; /* ป้องกันแถบ Address bar บนมือถือบังเนื้อหา */
            overflow: hidden;
            background-color: #ffffff;
        }

        /* ตั้งค่า iframe ให้แสดงผลเต็มจอแบบไม่มีขอบ */
        iframe {
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbyoxWAUIeeq3CXcObsGNSuKZVfZFy63AmebJxyQSBLfE9ypGsUNZmDsFsHHKYMC7I4/exec" 
        title="CarSW2026"
        allow="fullscreen; camera; microphone; geolocation; clipboard-read; clipboard-write;"
        allowfullscreen="true">
    </iframe>

</body>
</html>
